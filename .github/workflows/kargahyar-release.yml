name: KargahYar QA and APK

on:
  push:
    branches: [kargahyar-release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa-build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download production PWA
        run: |
          mkdir -p web
          curl --retry 5 --retry-delay 2 -fsSL https://kargahyar-production.vercel.app/ -o web/index.html
          curl --retry 5 --retry-delay 2 -fsSL https://kargahyar-production.vercel.app/manifest.webmanifest -o web/manifest.webmanifest
          curl --retry 5 --retry-delay 2 -fsSL https://kargahyar-production.vercel.app/sw.js -o web/sw.js
          curl --retry 5 --retry-delay 2 -fsSL https://kargahyar-production.vercel.app/icon.svg -o web/icon.svg
          test -s web/index.html
          grep -q 'کارگاه‌یار' web/index.html

      - name: Static validation
        run: |
          node --check web/sw.js
          python3 - <<'PY'
          import json,re
          json.load(open('web/manifest.webmanifest',encoding='utf-8'))
          html=open('web/index.html',encoding='utf-8').read()
          blocks=re.findall(r'<script>(.*?)</script>',html,re.S)
          assert blocks, 'inline application script not found'
          open('/tmp/kargahyar-app.js','w',encoding='utf-8').write('\n'.join(blocks))
          PY
          node --check /tmp/kargahyar-app.js

      - name: Browser QA - business rules and 20k records
        run: |
          python3 -m http.server 8765 --directory web >/tmp/kargahyar-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && break || sleep 1; done
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=60000 --dump-dom 'http://127.0.0.1:8765/?qa=1' > /tmp/qa-dom.html
          grep -q 'data-result="PASS"' /tmp/qa-dom.html
          echo 'PWA QA PASS'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create native Android shell
        run: |
          mkdir -p app/src/main/java/com/foad/kargahyar app/src/main/assets app/src/main/res/drawable app/src/main/res/mipmap-hdpi
          cp web/index.html web/manifest.webmanifest web/sw.js web/icon.svg app/src/main/assets/
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='KargahYar'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.foad.kargahyar'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.foad.kargahyar'
                  minSdk 24
                  targetSdk 35
                  versionCode 100
                  versionName '1.0.0'
              }
              buildTypes { release { minifyEnabled false } }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="کارگاه‌یار" android:allowBackup="true" android:supportsRtl="true" android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity" android:screenOrientation="unspecified" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/foad/kargahyar/MainActivity.java <<'EOF'
          package com.foad.kargahyar;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }
              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack(); else super.onBackPressed();
              }
              @Override protected void onDestroy() {
                  if (webView != null) { webView.destroy(); webView = null; }
                  super.onDestroy();
              }
          }
          EOF

      - name: Build installable APK
        run: |
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk KargahYar-1.0.0.apk
          ls -lh KargahYar-1.0.0.apk

      - name: Verify APK
        run: |
          apksigner verify --verbose KargahYar-1.0.0.apk
          aapt dump badging KargahYar-1.0.0.apk | tee /tmp/badging.txt
          grep -q "package: name='com.foad.kargahyar'" /tmp/badging.txt

      - uses: actions/upload-artifact@v4
        with:
          name: KargahYar-1.0.0-APK
          path: KargahYar-1.0.0.apk
          retention-days: 30

      - name: Publish downloadable APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='kargahyar-v1.0.0'
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title 'KargahYar 1.0.0' --notes 'QA-gated installable Android build. PWA business-rule QA, 20k-record test, APK signature and package verification passed.'
          gh release upload "$TAG" KargahYar-1.0.0.apk --clobber
