name: Build KargahYar APK
on:
  push:
    branches: [kargahyar-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode Android project
        run: |
          base64 -d kargahyar-build/project.tar.gz.b64 > /tmp/kargahyar-project.tar.gz
          tar -xzf /tmp/kargahyar-project.tar.gz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KargahYar-Offline-v0.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KargahYar-Offline-APK
          path: KargahYar-Offline-v0.2.apk
          retention-days: 7
