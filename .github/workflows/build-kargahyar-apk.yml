name: Build KargahYar APK
on:
  push:
    branches: [kargahyar-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle -p android-kargahyar :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp android-kargahyar/app/build/outputs/apk/debug/app-debug.apk KargahYar-v2-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KargahYar-v2-test-APK
          path: KargahYar-v2-test.apk
          retention-days: 14
